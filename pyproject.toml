# pyproject.toml
[project]
name = "helios"
version = "0.1.14.3.post9"
description = "Personal-grade institutional Taiwan stock automated investment system"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Helios Operator" }]
license = { text = "Proprietary" }

dependencies = [
    # Data
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # HTTP
    "httpx>=0.27",
    "tenacity>=9.0",
    # Logging
    "structlog>=24.0",
    # v0.1.8 — cross-source validation 用 (yfinance 5 年隨意抓，無 token)
    "yfinance>=0.2.40",
    # 註：pandas-ta 與 vectorbt 移到 optional groups (見下)
    #     原因：兩者透過 numba 帶入 llvmlite，在 Python 3.13+ 上 wheel 落後
    #     Step 3 開始用：uv sync --group features
    #     Step 6 開始用：uv sync --group backtest
    "shioaji>=1.3.3",
    "scipy>=1.17.1",
    "exchange-calendars>=4.13.2",
    "lxml>=6.1.1",
    "arch>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]
# Step 6 backtest - 帶 numba/llvmlite，建議搭配 Python 3.12
# 註：Step 3 indicator 庫的決策延到 Step 3 開工時 (pandas-ta 0.3.x 已從 PyPI 下架，
#     需評估 pandas-ta 0.4.x + numba / TA-Lib / 自寫 Polars 三選一)
backtest = ["vectorbt>=0.26"]
# Step 8 communication: python-telegram-bot v20+ async
comm = ["python-telegram-bot>=21.0"]
# v0.3 scheduler: APScheduler inside daemon
scheduler = ["apscheduler>=3.10"]
# v0.4 broker: Shioaji
broker = ["shioaji>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "data", "utils", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "RUF001", # ambiguous-unicode-character-string (Chinese punctuation is intentional)
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
# Notebooks need path setup before import; E402 is false positive there
"*.ipynb" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=term-missing"
markers = [
    "requires_db: tests that require helios.duckdb (read-only) to be present at data/_storage/helios.duckdb",
]
