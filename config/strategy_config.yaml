# config/strategy_config.yaml
# Version: v0.1.1 (2026-05-16)
# Changelog:
#   v0.1.1 (2026-05-16): 移除 require_regime，改由 risk_limits.yaml::regime_policy 處理
#   v0.1.0 (2026-05-16): Initial implementation
# 策略參數
# v0.1 只實作 trend_following，其餘預留

strategies:
  trend_following:
    enabled: true
    timeframe: 1d

    # MA 多頭排列
    ma_periods: [20, 60, 200]

    # 突破前高
    breakout_lookback: 20

    # 確認條件
    volume_expansion_threshold: 1.5 # 量 > 20 日均量 × 1.5
    adx_threshold: 25 # ADX > 25 確認趨勢

    # 訊號分數權重 (總和必須為 1.0)
    weights:
      ma_alignment: 0.30
      breakout: 0.30
      volume: 0.20
      adx: 0.20

  mean_reversion:
    enabled: false # v0.2

  multi_factor:
    enabled: false # v0.2

# 訊號通用過濾
filters:
  min_signal_score: 0.6 # 低於此分數丟棄
  # NOTE: regime 過濾已移至 risk_limits.yaml 的 regime_policy 矩陣
  # (review 採納：取代二元 require_regime，改為連續光譜 5 個狀態)

# Portfolio bucket 配置 (用於 portfolio/rebalancer.py)
buckets:
  core:
    weight: 0.70
    universe: blue_chip_etf
    holding_period: long # 3-12 個月
    max_positions: 3
    stop_loss_pct: 0.12

  rotation:
    weight: 0.20
    universe: sector_etf
    holding_period: medium # 1-3 個月
    max_positions: 2
    stop_loss_pct: 0.08

  momentum:
    weight: 0.10
    universe: mid_cap_momentum
    holding_period: short # 2-6 週
    max_positions: 2
    stop_loss_pct: 0.06
